name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          load: true
          tags: app-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export test image
        run: docker save app-test | gzip > app-test.tar.gz

      - name: Upload test image
        uses: actions/upload-artifact@v7
        with:
          name: app-test-image
          path: app-test.tar.gz
          retention-days: 1
          compression-level: 0

  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download test image
        uses: actions/download-artifact@v8
        with:
          name: app-test-image

      - name: Load test image
        run: docker load --input app-test.tar.gz

      - name: Run lint
        run: docker run --rm app-test composer lint

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download test image
        uses: actions/download-artifact@v8
        with:
          name: app-test-image

      - name: Load test image
        run: docker load --input app-test.tar.gz

      - name: Run tests
        run: docker run --rm app-test composer test -- --no-coverage

  publish:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DOKPLOY_DEPLOY_HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
    steps:
      - name: Trigger Dokploy deployment
        if: env.DOKPLOY_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$DOKPLOY_DEPLOY_HOOK"
